name: Rückrechnung (monatlich)

# Prognose-Paket 3: einmal im Monat über alle Aktien und Jahre ab 2009 auswerten, welche Lagen danach besser oder
# schlechter liefen als die mittlere Aktie. Ergebnis docs/bt.json (klein). Nur Anzeige, ändert keine Bewertung.
# Kurse liegen im Actions-Zwischenspeicher (_btcache), nicht im Repository. Seit Paket 5 lernt der Lauf auch das
# Prognosemodell (data/prog_model.json); scikit-learn wird nur hier installiert, der tägliche Lauf braucht es nicht.
on:
  schedule:
    - cron: "17 3 2 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 30
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt scikit-learn
      - name: Selbsttest
        run: python scripts/selftest.py
      - uses: actions/cache@v4
        with:
          path: _btcache
          key: btkurse-${{ github.run_id }}
          restore-keys: btkurse-
      - name: Rückrechnung
        run: python scripts/backtest.py
      - name: Ergebnis speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/bt.json data/prog_model.json 2>/dev/null || git add docs/bt.json
          git diff --cached --quiet && exit 0
          git commit -m "Rückrechnung $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 20; done
          exit 1
