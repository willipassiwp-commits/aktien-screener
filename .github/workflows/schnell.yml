name: Schnelle Kurse und Nachrichten

# Nur Anzeige: aktualisiert docs/vorb.json (Kurse großer US-Aktien an deutschen Börsen, US-Terminkontrakte,
# wichtigste Schlagzeilen). Ändert keine Bewertung. Läuft werktags während des deutschen Handels alle 10 Minuten;
# GitHub lässt geplante Läufe oft aus, deshalb die vielen Versuche. Teilt sich die Warteschlange mit
# „Daten aktualisieren“, damit beide nie gleichzeitig speichern.

on:
  schedule:
    - cron: "*/10 6-21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  schnell:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Schnelle Kurse und Schlagzeilen laden
        run: python scripts/vorboerse.py

      - name: Ergebnis speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/vorb.json data/de_map.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -q -m "Schnelle Kurse $(date -u +%H:%M)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
